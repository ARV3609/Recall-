:root{--bg:#EAF1FF;--card:#FFFFFF;--soft:#F1F3F8;--ink:#17181C;--mute:#5A6070;--blue:#8FA6FF;--coral:#FF9A9A;--sun:#FFD771;--mint:#86DDAE;--lilac:#CDB4FF;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;margin:0}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}

.lec .t{flex:1}.lec .t b{font-size:17px;display:block}.lec .t span{font-size:14px;color:var(--mute)}

.stat{background:var(--card);border-radius:32px;padding:24px;margin-bottom:16px}

.fc div.t{background:var(--coral)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.tile{border-radius:30px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}

.g1{background:var(--coral)}.g2{background:var(--sun)}.g3{background:var(--mint)}.g4{background:var(--blue)}
.qcard{min-height:120px}

.ctx{font-size:16px;font-weight:600;margin-top:16px;opacity:.75}

.in{width:100%;padding:16px 18px;border-radius:20px;border:0;background:var(--card);font:inherit;font-size:16px;color:var(--ink);margin-top:12px}
textarea.in{min-height:96px;resize:vertical}
.lbl{font-size:14px;color:var(--mute);margin-top:20px;font-weight:600}
.chips{display:flex;gap:10px;margin-top:12px}
.chip{flex:1;padding:14px;border-radius:999px;background:var(--card);font-weight:700}
.chip.on{background:var(--ink);color:#fff}

.chk{display:flex;gap:12px;align-items:center;margin-top:20px;font-weight:600;font-size:15px}.chk input{width:22px;height:22px;accent-color:#17181C}
.lec.ro{cursor:default}
.qg{flex:none;font-size:11px;font-weight:800;padding:5px 9px;border-radius:9px;background:var(--soft);color:var(--mute)}
.qg.g1{background:var(--coral);color:var(--ink)}.qg.g2{background:var(--sun);color:var(--ink)}.qg.g3{background:var(--mint);color:var(--ink)}.qg.g4{background:var(--blue);color:var(--ink)}
.x2{width:42px;height:42px;flex:none;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;line-height:1;font-weight:600;color:var(--mute)}
.x2:hover{background:var(--soft)}
.pan h2+ .sub{margin-top:8px}
.ring{background:var(--card);border-radius:40px;padding:26px;text-align:center;position:relative}.ring svg{width:240px;height:240px;transform:rotate(-90deg)}.ring .c{position:absolute;left:0;right:0;top:26px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .c b{font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1}.ring .c span{font-size:15px;color:var(--mute);margin-top:8px;font-weight:600}
.dots{display:flex;gap:10px;justify-content:center;margin-top:14px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--soft)}.dots i.on{background:var(--coral)}
.prow{display:flex;gap:10px;margin-top:16px}.prow .btn{margin-top:0}.prow .btn:first-child{flex:1}.prow .btn.alt{width:auto;padding:18px 22px}
.fcl{display:flex;gap:7px;margin-top:8px}.fcl span{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:700}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 10px 9px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;display:flex;align-items:center;gap:12px;max-width:calc(100% - 36px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;pointer-events:auto;display:none}
.toast.on{opacity:1}
@media(max-width:380px){.gwrap{gap:6px}.gwrap b{font-size:11.5px}.txt{font-size:22px}.qcard{margin:18px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
<div class="toast" id="toast" role="status" aria-live="polite"><span id="tm"></span><button id="tb" type="button" onclick="restore()">Undo</button></div>
<main class="view on" id="v-today"></main>
<main class="view" id="v-chapters"></main>
<main class="view" id="v-focus"></main>
<main class="view" id="v-progress"></main>
<main class="view" id="v-settings"></main>
<nav id="nav"></nav>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Review lecture">
  <div class="prog"><button class="x" onclick="closeReview()" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="bar"><i id="pb" style="width:0;background:var(--blue)"></i></div><button class="x" id="undo" onclick="undo()" aria-label="Undo last rating" style="visibility:hidden"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button></div>
  <div class="qcard" id="qc"><div class="lab lect" id="lab"></div><div class="ctx" id="ctx"></div><div class="txt" id="txt"></div></div>
  <div class="gwrap" id="grd"></div>
  <div class="done" id="dn">
    <svg width="140" height="120" viewBox="0 0 140 120" aria-hidden="true"><circle cx="42" cy="62" r="34" fill="#FF9A9A"/><circle cx="98" cy="62" r="34" fill="#FFD771"/><path d="M70 12l6 14 14 2-10 10 3 15-13-8-13 8 3-15-10-10 14-2z" fill="#8FA6FF"/></svg>
    <h1 style="margin-top:24px">Great job!</h1><p class="sub" id="dsub"></p>
    <button class="reveal" style="margin-top:32px" onclick="closeReview()">Back to Today</button>
  </div>
</div>
<div class="sheet" id="sh" role="dialog" aria-modal="true" onclick="if(event.target===this)closeSh()"><div class="pan" id="pan"></div></div>
</div>
<script>
var DAY=864e5,COL=['var(--coral)','var(--sun)','var(--mint)','var(--blue)','var(--lilac)'],KEY='recall.v1',VER=4;
function DEF(){return{chs:[],lecs:[],cards:[],log:[],focus:[],pt:{m:'focus',run:false,end:0,rem:null,cy:0,ch:0},set:{ret:.9,exam:'',fm:25,bm:5,lb:15,rt:'20:00'},nid:1,v:VER}}
var DB=DEF(),tab='today',sess=null,LAST=null,toastT=null,saveWarned=false;
function $(s){return document.getElementById(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function cl(v,a,b){return Math.min(b,Math.max(a,v))}
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function toast(m,undo){var t=$('toast');if(!t)return;$('tm').textContent=m;$('tb').style.display=undo?'inline-block':'none';t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},undo?6000:1900)}
function keep(){try{LAST=JSON.parse(JSON.stringify({chs:DB.chs,lecs:DB.lecs,cards:DB.cards,log:DB.log,focus:DB.focus}))}catch(e){LAST=null}}
function restore(){if(!LAST)return;DB.chs=LAST.chs;DB.lecs=LAST.lecs;DB.cards=LAST.cards;DB.log=LAST.log;DB.focus=LAST.focus;LAST=null;save();sessClean();render();toast('Restored')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){if(!saveWarned){saveWarned=true;toast('Storage is full — export a backup')}}snap()}
function load(){try{var j=localStorage.getItem(KEY);if(j)DB=normalize(JSON.parse(j))}catch(e){DB=DEF()}}
/* ---------- schema ----------
   A lecture is the thing you review and rate. Questions are just a list you
   keep on it. Older saves (one schedule per question) are migrated on load. */
function avg(a,f){if(!a.length)return 0;var s=0;a.forEach(function(x){s+=(+x[f]||0)});return s/a.length}
function normalize(d){
 d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
 d.chs=Array.isArray(d.chs)?d.chs.filter(function(c){return c&&typeof c==='object'}).map(function(c){
   c.id=+c.id||0;c.num=+c.num||1;c.name=String(c.name||'');c.done=!!c.done;
   c.doneAt=+c.doneAt||0;c.testDue=+c.testDue||0;c.testDone=!!c.testDone;return c;
 }).filter(function(c){return c.id>0}):[];
 var oldSched={};(Array.isArray(d.lecs)?d.lecs:[]).forEach(function(l){
  if(l&&typeof l==='object'&&l.due!=null&&isFinite(+l.due))
   oldSched[+l.id]={due:+l.due,S:+l.S||0,D:+l.D||5,reps:+l.reps||0,lapses:+l.lapses||0,last:+l.last||0,state:l.state||'new',leech:!!l.leech}});
 d.cards=Array.isArray(d.cards)?d.cards.filter(function(c){return c&&typeof c==='object'&&c.k!=='P'}).map(function(c){
   c.id=+c.id||0;c.k=c.k==='S'?'S':'L';c.ch=+c.ch||0;c.lec=+c.lec||0;
   c.label=String(c.label||'');c.text=String(c.text||'');
   var os=oldSched[c.lec];                       // v3 save: the lecture held the schedule
   if(os&&(c.due==null||!isFinite(+c.due))){c.due=os.due;c.S=os.S;c.D=os.D;c.reps=os.reps;c.lapses=os.lapses;c.last=os.last;c.state=os.state;c.leech=os.leech}
   c.due=+c.due||Date.now();c.S=+c.S||0;c.D=+c.D||5;c.reps=+c.reps||0;
   c.lapses=+c.lapses||0;c.last=+c.last||0;c.state=c.state||'new';c.leech=!!c.leech;
   return c;
 }).filter(function(c){return c.id>0}):[];
 d.lecs=Array.isArray(d.lecs)?d.lecs.filter(function(l){return l&&typeof l==='object'}).map(function(l){
   var lid=+l.id||0;
   return{id:lid,ch:+l.ch||0,num:+l.num||1,                       // a lecture is a label, not a schedule
    ps:!!l.ps||d.cards.some(function(c){return c.lec===lid&&c.k==='S'})};
 }).filter(function(l){return l.id>0}):[];
 d.cards=d.cards.filter(function(c){return c.k!=='S'});   // practice sheet is now a lecture flag
 d.log=Array.isArray(d.log)?d.log.filter(function(l){return l&&isFinite(l.t)}):[];
 d.focus=Array.isArray(d.focus)?d.focus.filter(function(f){return f&&isFinite(f.t)&&isFinite(f.m)}):[];
 d.pt=Object.assign({m:'focus',run:false,end:0,rem:null,cy:0,ch:0},(d.pt&&typeof d.pt==='object')?d.pt:{});
 if(['focus','break','long'].indexOf(d.pt.m)<0)d.pt.m='focus';
 d.set=Object.assign({ret:.9,exam:'',fm:25,bm:5,lb:15,rt:'20:00'},(d.set&&typeof d.set==='object')?d.set:{});
 if([.85,.9,.95].indexOf(+d.set.ret)<0)d.set.ret=.9;
 d.nid=fixIds(d);d.v=VER;
 return d;
}
function fixIds(d){
 var seen={},mx=0;
 function bump(o){if(+o.id>mx)mx=+o.id}
 d.chs.forEach(bump);d.lecs.forEach(bump);d.cards.forEach(bump);
 var nid=Math.max(mx+1,+d.nid||1);
 d.cards.forEach(function(c){if(seen[c.id])c.id=nid++;seen[c.id]=1});
 d.chs.forEach(function(c){seen[c.id]=1});d.lecs.forEach(function(l){seen[l.id]=1});
 return nid;
}
function fix(){DB=normalize(DB);relabel()}
function ch(id){return DB.chs.filter(function(c){return c.id===id})[0]}
function lec(id){return DB.lecs.filter(function(c){return c.id===id})[0]}
function cnum(id){var c=ch(id);return c?c.num:'?'}
function qsOf(lecId){return DB.cards.filter(function(c){return c.lec===lecId}).sort(function(a,b){return a.id-b.id})}
function items(l){return qsOf(l.id).length+(l.ps?1:0)}
function exam(){return DB.set.exam?new Date(DB.set.exam+'T00:00:00').getTime():0}
/* ---------- scheduler (FSRS-style), one date per QUESTION ---------- */
function Rq(q,t){if(q.state==='new'||!q.S)return 0;return Math.pow(1+19/81*Math.max(0,t-q.last)/DAY/q.S,-.5)}
function chapMod(chId){var r=0,x=0;DB.cards.forEach(function(c){if(c.ch===chId){r+=c.reps;x+=c.lapses}});return r<6?1:cl(1-.5*x/r,.7,1)}
function fuzzQ(q){var h=Math.abs((q.id*2654435761+q.reps*97)%1000);return (h/1000-.5)*.1}
function schedQ(q,g,t){
 var S,D,lap=0;
 if(q.state==='new'){S=[.4,1,3,8][g-1];D=cl(5-(g-3)*1.2,1,10)}
 else{var r=Rq(q,t);D=q.D;

  DB.lecs.push(l);return l;
 }
 addL(c2.id,1,6,t-4*DAY,2);addL(c2.id,2,5,t-2*DAY,1);addL(c2.id,3,6,t,0);
 addL(c3.id,1,7,t,0);addL(c3.id,2,4,t+2*DAY,0);
 DB.lecs[0].ps=true;
 for(i=1;i<=12;i++){var ds=dayStart(t)-i*DAY,rn=3+(i*7)%9,sn=1+i%3;
  for(j=0;j<rn;j++)DB.log.push({t:ds+9*36e5+j*6e5,g:Math.random()<.14?1:Math.random()<.5?3:4,c:DB.cards[(i+j)%DB.cards.length].id});
  for(j=0;j<sn;j++)DB.focus.push({t:ds+17*36e5+j*36e5,m:25,ch:j%2?c3.id:c2.id})}
 relabel();save();tab='today';closeSh();render();toast('Sample data loaded',true)}
/* ---------- review: one question at a time, rated on how well you remembered it ---------- */
function startAll(){begin(dueLecs().map(function(x){return x.l.id}),'Today',0)}
function startOne(id){begin([id],'Today',0)}
function beginChapter(id){var ids=DB.lecs.filter(function(l){return l.ch===id}).map(function(l){return l.id});closeSh();begin(ids,'Chapter',0)}
function testSheet(id){var c=ch(id);if(!c)return;
 var ls=DB.lecs.filter(function(l){return l.ch===id}),n=DB.cards.filter(function(x){return x.ch===id}).length;
 var t=Date.now(),ready=c.testDue<=t;
 var h='<h2>Ch'+c.num+' test</h2><p class="sub">'+ls.length+(ls.length===1?' lecture':' lectures')+' · '+n+' questions, rated one after another.</p>';
 h+=ready?'<p class="sub">The whole chapter in one run.</p>':'<p class="sub">Scheduled for '+new Date(c.testDue).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'. Starting now reviews it early — it just comes back sooner.</p>';
 h+='<button class="btn" onclick="beginTest('+id+')">'+(ready?'Start test':'Start early')+'</button>';
 sh(h)}
function beginTest(id){var c=ch(id);if(!c)return;closeSh();
 begin(DB.lecs.filter(function(l){return l.ch===id}).sort(function(a,b){return a.num-b.num}).map(function(l){return l.id}),'Test',id)}
function startTest(id){testSheet(id)}
function begin(ids,t,tc){
 ids=ids.filter(function(i){return !!lec(i)&&pendOf(i).length});
 if(!ids.length){toast('Nothing due');return}
 sess={ids:ids,i:0,test:tc,h:[],rated:0,total:0};
 ids.forEach(function(i){sess.total+=pendOf(i).length});
 $('ov').classList.add('on');$('ov').classList.remove('fin');$('dn').classList.remove('on');
 show();
}
function curQ(){if(!sess)return null;var p=pendOf(sess.ids[sess.i]);return p[0]||null}
function show(){
 if(!sess)return;
 while(sess.i<sess.ids.length&&!pendOf(sess.ids[sess.i]).length)sess.i++;
 if(sess.i>=sess.ids.length){finish();return}
 var l=lec(sess.ids[sess.i]),qs=qsOf(l.id),c=curQ();
 if(!c||!l){finish();return}
 var idx=qs.map(function(x){return x.id}).indexOf(c.id)+1;
 $('lab').textContent=lname(l);
 $('ctx').textContent='Question '+idx+' of '+qs.length+(c.lastG?' · last time '+GRADE[c.lastG]:' · first time');
 $('txt').textContent=c.text||('Q'+idx);
 drawGrades(c);
 $('pb').style.width=Math.round(sess.rated/Math.max(1,sess.total)*100)+'%';
 $('undo').style.visibility=sess.h.length?'visible':'hidden';
 $('dn').classList.remove('on');
}
function drawGrades(c){
 var t=Date.now(),h='';
 for(var g=1;g<=4;g++){
  var pl=planQ(c,g,t);
  h+='<button class="g g'+g+'" onclick="gradeQ('+g+')"><b>'+GRADE[g]+'</b><i>'+(g===1?'10m':fmt((pl.due-t)/DAY))+'</i></button>';
 }
 $('grd').innerHTML=h;
}
function gradeQ(g){
 if(!sess)return;
 var c=curQ();if(!c)return;
 sess.h.push({id:c.id,s:JSON.stringify(c),l:DB.log.length});
 c.lastG=g;sess.rated++;
 applyQ(c,g);
 show();
}
function finish(){
 if(sess&&sess.test&&ch(sess.test)){ch(sess.test).testDone=true;save()}
 var n=sess?sess.rated:0;
 $('ov').classList.add('fin');$('pb').style.width='100%';
 $('undo').style.visibility=(sess&&sess.h.length)?'visible':'hidden';
 $('dsub').textContent=n+(n===1?' question rated.':' questions rated.');
 $('dn').classList.add('on');
}
function undo(){if(!sess)return;var h=sess.h.pop();if(!h)return;
 var c=DB.cards.filter(function(x){return x.id===h.id})[0];
 if(c){var o=JSON.parse(h.s);                        // restore the question exactly, not just its keys
  Object.keys(c).forEach(function(k){delete c[k]});Object.assign(c,o);
  var k=sess.ids.indexOf(c.lec);if(k>=0)sess.i=k}
 DB.log.length=h.l;sess.rated=Math.max(0,sess.rated-1);
 if(sess.test&&ch(sess.test))ch(sess.test).testDone=false;
 $('ov').classList.remove('fin');$('dn').classList.remove('on');
 save();show();
}
function closeReview(){$('ov').classList.remove('on');$('ov').classList.remove('fin');sess=null;render();tickNext();setTimeout(tryReload,300)}
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if($('sh')&&$('sh').classList.contains('on')){closeSh();return}
 if($('ov')&&$('ov').classList.contains('on'))closeReview()});
/* boot */
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
function boot(){try{load();fix();render()}catch(e){
 DB=DEF();
 try{$('v-today').innerHTML='<div class="head"><h1>Recall</h1></div><div class="empty"><b>Your saved data could not be read</b><p>That can happen after an interrupted save or a bad import. Reset to start clean, or try reloading first.</p><button class="btn" onclick="location.reload()">Reload</button><button class="btn bad" onclick="wipe()">Reset data</button></div>';$('v-today').classList.add('on');$('nav').innerHTML=''}catch(x){} }}
/* the shell is a fixed pane; if any browser still nudges the document (toolbar
   transitions, an old WebView, a keyboard), put it back so the nav cannot slide off */
function pinViewport(){try{if(window.scrollY||window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop)window.scrollTo(0,0)}catch(e){}}
window.addEventListener('resize',pinViewport);
window.addEventListener('orientationchange',pinViewport);
if(window.visualViewport)window.visualViewport.addEventListener('resize',pinViewport);
boot();pinViewport();setInterval(function(){if(DB.pt.run&&pLeft()<=0)pEnd(true);else pDraw();tickNext();if(++tickN%5===0)refreshDue()},1000);setInterval(tick,30000);document.addEventListener('visibilitychange',function(){tick();if(!document.hidden)refreshDue(true);tickNext()});tick();sw();schedDaily();setInterval(tryReload,5000);
</script>
