<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recall</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EAF1FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recall">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF1FF;--card:#FFFFFF;--soft:#F1F3F8;--ink:#17181C;--mute:#5A6070;--blue:#8FA6FF;--coral:#FF9A9A;--sun:#FFD771;--mint:#86DDAE;--lilac:#CDB4FF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,.in:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{width:100%;max-width:430px;height:100%;height:100dvh;position:relative;overflow:hidden}
.view{display:none;height:100%;overflow-y:auto;padding:36px 24px 120px}
.view.on{display:block}
h1{font-size:38px;line-height:1.02;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mute);font-size:15px;margin-top:10px}
.head{margin-bottom:30px}
.hero{background:var(--blue);border-radius:36px;padding:28px 26px 26px;position:relative;overflow:hidden}
.hero .big{font-size:92px;font-weight:800;line-height:.85;letter-spacing:-.05em}
.hero p{font-size:16px;font-weight:500;margin-top:14px;max-width:180px;line-height:1.3}
.hero .go{margin-top:26px;background:var(--ink);color:#fff;padding:17px 30px;border-radius:999px;font-weight:700;font-size:16px}
.hero svg{position:absolute;right:-6px;top:22px;width:140px}
.note{background:var(--sun);border-radius:28px;padding:20px 24px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.note b{font-size:18px;display:block}.note span{font-size:14px;opacity:.75}
.note em{font-style:normal;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;flex:none}
.label{font-size:18px;font-weight:800;margin:38px 0 14px}
.lec{background:var(--card);border-radius:28px;padding:18px 20px;display:flex;gap:16px;align-items:center;margin-bottom:12px;width:100%;text-align:left}
.lec i{width:14px;height:14px;border-radius:50%;flex:none}
.lec .t{flex:1}.lec .t b{font-size:17px;display:block}.lec .t span{font-size:14px;color:var(--mute)}
.lec .n{font-weight:800;font-size:22px}
.chap{background:var(--card);border-radius:32px;padding:24px;margin-bottom:16px;width:100%;text-align:left;display:block}
.chap h3{font-size:22px;font-weight:800}
.chap p{font-size:14px;color:var(--mute);margin-top:6px}
.bar{height:10px;border-radius:99px;background:var(--soft);margin-top:20px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.stat{background:var(--card);border-radius:32px;padding:24px;margin-bottom:16px}
.stat b{font-size:18px}
.fc{display:flex;gap:7px;align-items:flex-end;height:140px;margin-top:22px}
.fc div{flex:1;border-radius:10px;background:var(--blue);min-height:6px}
.fc div.t{background:var(--coral)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.tile{border-radius:30px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.04em}.tile b.sm{font-size:36px;white-space:nowrap}.tile span{font-size:15px;font-weight:600}
nav{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);border-radius:999px;display:flex;justify-content:space-between;align-items:center;padding:8px;z-index:3}
nav button{color:#A9AEC2;flex:1 1 0;min-width:0;max-width:56px;height:48px;border-radius:50%;display:grid;place-items:center}
nav button.on{background:#fff;color:var(--ink)}
nav button.plus{background:var(--coral);color:var(--ink)}
nav svg,.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ov{position:absolute;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.ov.on{display:flex}
.prog{display:flex;align-items:center;gap:16px}
.x{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.prog .bar{flex:1;margin:0;background:var(--card)}
.qcard{flex:1;margin:28px 0;border-radius:40px;background:var(--lilac);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.lab{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1.02}
.ctx{font-size:16px;font-weight:600;margin-top:16px;opacity:.75}
.txt{margin-top:24px;background:rgba(255,255,255,.6);border-radius:20px;padding:14px 18px;font-size:16px}
.reveal{width:100%;padding:19px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:17px}
.grades{display:none;grid-template-columns:repeat(4,1fr);gap:10px}
.grades.on{display:grid}
.g{border-radius:24px;padding:17px 4px;font-weight:800;font-size:15px;display:flex;flex-direction:column;gap:4px;align-items:center}
.g small{font-size:12px;font-weight:600;opacity:.7}
.done{text-align:center;display:none;flex:1;flex-direction:column;align-items:center;justify-content:center}
.done.on{display:flex}
.empty{background:var(--card);border-radius:36px;padding:36px 26px;text-align:center}
.empty b{font-size:22px;display:block}.empty p{color:var(--mute);margin-top:10px;font-size:15px}
.sheet{position:absolute;inset:0;background:rgba(23,24,28,.35);z-index:8;display:none;align-items:flex-end}
.sheet.on{display:flex}
.pan{background:var(--bg);border-radius:36px 36px 0 0;padding:30px 24px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-height:90%;overflow-y:auto}
.pan h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.in{width:100%;padding:16px 18px;border-radius:20px;border:0;background:var(--card);font:inherit;font-size:16px;color:var(--ink);margin-top:12px}
textarea.in{min-height:96px;resize:vertical}
.lbl{font-size:14px;color:var(--mute);margin-top:20px;font-weight:600}
.chips{display:flex;gap:10px;margin-top:12px}
.chip{flex:1;padding:14px;border-radius:999px;background:var(--card);font-weight:700}
.chip.on{background:var(--ink);color:#fff}
.btn{width:100%;padding:18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;margin-top:18px}
.btn.alt{background:var(--card);color:var(--ink)}.btn.bad{background:var(--coral);color:var(--ink)}
.qrow{display:flex;gap:12px;align-items:center;margin-top:12px}
.qrow b{font-size:14px;width:78px;flex:none}.qrow .in{margin:0;flex:1;width:auto;min-width:0}
.chk{display:flex;gap:12px;align-items:center;margin-top:20px;font-weight:600;font-size:15px}.chk input{width:22px;height:22px;accent-color:#17181C}
.lec.ro{cursor:default}
.x2{width:42px;height:42px;flex:none;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;line-height:1;font-weight:600;color:var(--mute)}
.x2:hover{background:var(--soft)}
.pan h2+ .sub{margin-top:8px}
.ring{background:var(--card);border-radius:40px;padding:26px;text-align:center;position:relative}.ring svg{width:240px;height:240px;transform:rotate(-90deg)}.ring .c{position:absolute;left:0;right:0;top:26px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .c b{font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1}.ring .c span{font-size:15px;color:var(--mute);margin-top:8px;font-weight:600}
.dots{display:flex;gap:10px;justify-content:center;margin-top:14px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--soft)}.dots i.on{background:var(--coral)}
.prow{display:flex;gap:10px;margin-top:16px}.prow .btn{margin-top:0}.prow .btn:first-child{flex:1}.prow .btn.alt{width:auto;padding:18px 22px}
.fcl{display:flex;gap:7px;margin-top:8px}.fcl span{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:700}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 10px 9px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;display:flex;align-items:center;gap:12px;max-width:calc(100% - 36px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;pointer-events:auto;display:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<div class="toast" id="toast" role="status" aria-live="polite"><span id="tm"></span><button id="tb" type="button" onclick="restore()">Undo</button></div>
<main class="view on" id="v-today"></main>
<main class="view" id="v-chapters"></main>
<main class="view" id="v-focus"></main>
<main class="view" id="v-progress"></main>
<main class="view" id="v-settings"></main>
<nav id="nav"></nav>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Review">
  <div class="prog"><button class="x" onclick="closeReview()" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="bar"><i id="pb" style="width:0;background:var(--blue)"></i></div><button class="x" id="undo" onclick="undo()" aria-label="Undo last grade" style="visibility:hidden"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button></div>
  <div class="qcard" id="qc"><div class="lab" id="lab"></div><div class="ctx" id="ctx"></div><div class="txt" id="txt"></div></div>
  <button class="reveal" id="rev" onclick="reveal()">Reveal</button>
  <div class="grades" id="gr"></div>
  <div class="done" id="dn">
    <svg width="140" height="120" viewBox="0 0 140 120" aria-hidden="true"><circle cx="42" cy="62" r="34" fill="#FF9A9A"/><circle cx="98" cy="62" r="34" fill="#FFD771"/><path d="M70 12l6 14 14 2-10 10 3 15-13-8-13 8 3-15-10-10 14-2z" fill="#8FA6FF"/></svg>
    <h1 style="margin-top:24px">Great job!</h1><p class="sub" id="dsub"></p>
    <button class="reveal" style="margin-top:32px" onclick="closeReview()">Back to Today</button>
  </div>
</div>
<div class="sheet" id="sh" role="dialog" aria-modal="true" onclick="if(event.target===this)closeSh()"><div class="pan" id="pan"></div></div>
</div>
<script>
var DAY=864e5,COL=['var(--coral)','var(--sun)','var(--mint)','var(--blue)','var(--lilac)'],KEY='recall.v1',VER=2;
function DEF(){return{chs:[],lecs:[],cards:[],log:[],focus:[],pt:{m:'focus',run:false,end:0,rem:null,cy:0,ch:0},set:{ret:.9,exam:'',fm:25,bm:5,lb:15,rt:'20:00'},nid:1,v:VER}}
var DB=DEF(),tab='today',sess=null,G=[],LAST=null,toastT=null,saveWarned=false;
function $(s){return document.getElementById(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function cl(v,a,b){return Math.min(b,Math.max(a,v))}
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function toast(m,undo){var t=$('toast');if(!t)return;$('tm').textContent=m;$('tb').style.display=undo?'inline-block':'none';t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},undo?6000:1900)}
function keep(){try{LAST=JSON.parse(JSON.stringify({chs:DB.chs,lecs:DB.lecs,cards:DB.cards,log:DB.log,focus:DB.focus}))}catch(e){LAST=null}}
function restore(){if(!LAST)return;DB.chs=LAST.chs;DB.lecs=LAST.lecs;DB.cards=LAST.cards;DB.log=LAST.log;DB.focus=LAST.focus;LAST=null;save();sessClean();render();toast('Restored')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){if(!saveWarned){saveWarned=true;toast('Storage is full — export a backup')}}snap()}
function load(){try{var j=localStorage.getItem(KEY);if(j)DB=normalize(JSON.parse(j))}catch(e){DB=DEF()}}
/* --- schema: every key and every card field gets a safe default --- */
function normalize(d){
 d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
 d.chs=Array.isArray(d.chs)?d.chs.filter(function(c){return c&&typeof c==='object'&&isFinite(c.num)}):[];
 d.lecs=Array.isArray(d.lecs)?d.lecs.filter(function(l){return l&&typeof l==='object'&&isFinite(l.num)}):[];
 d.cards=Array.isArray(d.cards)?d.cards.filter(function(c){return c&&typeof c==='object'}).map(function(c){
  c.id=+c.id||0;c.k=(c.k==='S'||c.k==='P')?c.k:'L';c.ch=+c.ch||0;c.lec=+c.lec||0;
  c.label=String(c.label||'');c.text=String(c.text||'');c.due=+c.due||Date.now();
  c.S=+c.S||0;c.D=+c.D||5;c.reps=+c.reps||0;c.lapses=+c.lapses||0;c.last=+c.last||0;
  c.state=c.state||'new';c.leech=!!c.leech;if(c.k==='P')c.set=+c.set||0;return c;
 }).filter(function(c){return c.id>0}):[];
 d.log=Array.isArray(d.log)?d.log.filter(function(l){return l&&isFinite(l.t)}):[];
 d.focus=Array.isArray(d.focus)?d.focus.filter(function(f){return f&&isFinite(f.t)&&isFinite(f.m)}):[];
 d.pt=Object.assign({m:'focus',run:false,end:0,rem:null,cy:0,ch:0},(d.pt&&typeof d.pt==='object')?d.pt:{});
 if(['focus','break','long'].indexOf(d.pt.m)<0)d.pt.m='focus';
 d.set=Object.assign({ret:.9,exam:'',fm:25,bm:5,lb:15,rt:'20:00'},(d.set&&typeof d.set==='object')?d.set:{});
 if([.85,.9,.95].indexOf(+d.set.ret)<0)d.set.ret=.9;
 d.chs=d.chs.filter(function(c){c.id=+c.id||0;c.num=+c.num||1;c.name=String(c.name||'');c.done=!!c.done;c.doneAt=+c.doneAt||0;c.testDue=+c.testDue||0;c.testDone=!!c.testDone;return c.id>0});
 d.lecs=d.lecs.filter(function(l){l.id=+l.id||0;l.ch=+l.ch||0;l.num=+l.num||1;return l.id>0});
 d.nid=fixIds(d);d.v=VER;
 return d;
}
function fixIds(d){
 var seen={},mx=0;
 function bump(o){if(+o.id>mx)mx=+o.id}
 d.chs.forEach(bump);d.lecs.forEach(bump);d.cards.forEach(bump);
 var nid=Math.max(mx+1,+d.nid||1);
 d.cards.forEach(function(c){if(seen[c.id])c.id=nid++;seen[c.id]=1});
 d.chs.forEach(function(c){seen[c.id]=1});d.lecs.forEach(function(l){seen[l.id]=1});
 return nid;
}
function fix(){DB=normalize(DB);relabel()}
function ch(id){return DB.chs.filter(function(c){return c.id===id})[0]}
function lec(id){return DB.lecs.filter(function(c){return c.id===id})[0]}
function cnum(id){var c=ch(id);return c?c.num:'?'}
function exam(){return DB.set.exam?new Date(DB.set.exam+'T00:00:00').getTime():0}
/* scheduler: FSRS-style memory model */
function R(c,t){if(c.state==='new')return 0;return Math.pow(1+19/81*Math.max(0,t-c.last)/DAY/c.S,-.5)}
function chapMod(id){var r=0,l=0;DB.cards.forEach(function(c){if(c.ch===id){r+=c.reps;l+=c.lapses}});return r<6?1:cl(1-.5*l/r,.7,1)}
function fuzz(c){var h=Math.abs((c.id*2654435761+c.reps*97)%1000);return (h/1000-.5)*.1}
function sched(c,g,t){var S,D,lap=0;
 if(c.state==='new'){S=[.4,1,3,8][g-1];D=cl(5-(g-3)*1.2,1,10)}
 else{var r=R(c,t);D=c.D;
  if(g===1){S=cl(1.93*Math.pow(D,-.11)*(Math.pow(c.S+1,.29)-1)*Math.exp(2.27*(1-r)),.3,c.S);lap=1}
  else{var m=g===2?.29:g===4?2.61:1;S=c.S*(1+Math.exp(1.49)*(11-D)*Math.pow(c.S,-.14)*(Math.exp(.94*(1-r))-1)*m)}
  D=cl(D-.8*(g-3),1,10);D=.9*D+.5}
 var iv;
 if(g===1)iv=10/1440;
 else{iv=S*81/19*(Math.pow(DB.set.ret,-2)-1);iv*=(c.k==='P'?.85:1)*chapMod(c.ch);
  var ex=exam(),left=(ex-t)/DAY;if(ex&&left>0)iv=Math.min(iv,Math.max(1,left/2));
  iv=Math.max(1,iv);if(iv>=3)iv*=1+fuzz(c)}
 return{S:S,D:D,iv:iv,lap:lap}}
function balance(c,due,t){var base=dayStart(due),best=base,bc=1e9;
 [-1,0,1,2].forEach(function(o){var d=base+o*DAY;if(d<dayStart(t)+DAY)return;
  var k=DB.cards.filter(function(x){return x!==c&&dayStart(x.due)===d}).length+Math.abs(o)*.5;if(k<bc){bc=k;best=d}});
 return best}
/* one source of truth: what the grade button previews is exactly what gets stored */
function plan(c,g,t){var n=sched(c,g,t),due=t+n.iv*DAY;if(n.iv>=3)due=balance(c,due,t);return{n:n,due:due}}
function fmt(d){if(d<1/24)return Math.max(1,Math.round(d*1440))+'m';if(d<1)return Math.round(d*24)+'h';if(d<30)return Math.round(d)+'d';return Math.round(d/30)+'mo'}
function apply(c,g){var t=Date.now(),p=plan(c,g,t),n=p.n;
 c.S=n.S;c.D=n.D;c.reps++;c.lapses+=n.lap;c.last=t;c.state=g===1?'relearn':'review';if(c.lapses>=4)c.leech=true;
 c.due=p.due;DB.log.push({t:t,g:g,c:c.id});if(DB.log.length>4000)DB.log.splice(0,500);save()}
function dueQ(){var t=Date.now();return DB.cards.filter(function(c){return c.due<=t&&!(c.k==='P'&&c.state==='new')}).sort(function(a,b){return R(a,t)-R(b,t)})}
function mk(k,chId,lecId,label,text,due){var c={id:DB.nid++,k:k,ch:chId,lec:lecId,label:label||'',text:text||'',due:due,S:0,D:5,reps:0,lapses:0,last:0,state:'new',leech:false};if(k==='P')c.set=0;DB.cards.push(c);return c}
/* labels are derived, never stored by hand -> editing a chapter/lecture number never leaves stale "Ch1 L2" text */
function relabel(){
 var seq={},ps={};
 DB.cards.slice().sort(function(a,b){return a.id-b.id}).forEach(function(c){
  var cp=ch(c.ch);if(!cp)return;
  if(c.k==='L'){var l=lec(c.lec);if(!l)return;var k='L'+c.lec;seq[k]=(seq[k]||0)+1;c.label='Ch'+cp.num+' L'+l.num+' Q'+seq[k]}
  else if(c.k==='S'){var l2=lec(c.lec);if(!l2)return;c.label='Ch'+cp.num+' L'+l2.num+' Practice Sheet'}
  else if(c.k==='P'){var k2='P'+c.ch;ps[k2]=(ps[k2]||0)+1;if(!c.set)c.set=ps[k2];c.label='Ch'+cp.num+' PYQ Set '+c.set}
 });
}

function chSheet(id){var c=ch(id);if(!c)return;
 var ls=DB.lecs.filter(function(l){return l.ch===id}).sort(function(a,b){return a.num-b.num}),t=Date.now(),cs=DB.cards.filter(function(x){return x.ch===id});
 var h='<h2>Ch'+c.num+(c.name?' '+esc(c.name):'')+'</h2><p class="sub">'+ls.length+(ls.length===1?' lecture':' lectures')+' · '+cs.filter(function(x){return x.k==='L'}).length+' questions'+(c.done?(c.testDone?' · complete':' · test pending'):'')+'</p>';
 h+='<div class="lbl">Lectures</div>';
 if(!ls.length)h+='<p class="sub" style="margin-top:8px">No lectures yet.</p>';
 ls.forEach(function(l,i){var lc=DB.cards.filter(function(x){return x.lec===l.id}),dq=lc.filter(function(x){return x.due<=t}).length;
  h+=row(i,'Lecture '+l.num,lc.filter(function(x){return x.k==='L'}).length+' questions'+(lc.some(function(x){return x.k==='S'})?' + practice sheet':''),dq,'lecSheet('+l.id+')')});
 h+='<button class="btn" onclick="addSheet('+id+')">Add lecture</button>';
 if(!c.done)h+='<button class="btn alt" onclick="compSheet('+id+')">Mark chapter complete</button>';
 else if(!c.testDone)h+='<button class="btn alt" onclick="testSheet('+id+')">Chapter test'+(c.testDue>t?' (in '+Math.max(1,Math.ceil((c.testDue-t)/DAY))+'d)':'')+'</button>';
 h+='<button class="btn alt" onclick="editChSheet('+id+')">Edit chapter</button>';
 h+='<button class="btn bad" onclick="delCh('+id+')">Delete chapter</button>';
 sh(h)}
function editChSheet(id){var c=ch(id);if(!c)return;
 sh('<h2>Edit chapter</h2><div class="lbl">Chapter number</div><input class="in" id="e-num" type="number" min="1" inputmode="numeric" value="'+c.num+'"><div class="lbl">Chapter name</div><input class="in" id="e-name" placeholder="Optional" value="'+esc(c.name)+'"><button class="btn" onclick="doEditCh('+id+')">Save chapter</button><button class="btn bad" onclick="delCh('+id+')">Delete chapter</button>')}
function doEditCh(id){var c=ch(id);if(!c)return;
 var num=parseInt($('e-num').value,10);if(!(num>=1)){toast('Enter a chapter number');return}
 if(DB.chs.some(function(x){return x.id!==id&&x.num===num})){toast('Chapter '+num+' already exists');return}
 c.num=num;c.name=$('e-name').value.trim();relabel();save();chSheet(id);render();toast('Chapter saved')}
function delCh(id){var c=ch(id);if(!c)return;keep();
 DB.chs=DB.chs.filter(function(x){return x.id!==id});DB.lecs=DB.lecs.filter(function(l){return l.ch!==id});DB.cards=DB.cards.filter(function(x){return x.ch!==id});
 sessClean();save();closeSh();render();toast('Ch'+c.num+' deleted',true)}
/* lecture sheet: every question is editable, deletable, and more can be added later */
function lecSheet(id){var l=lec(id);if(!l)return;var c=ch(l.ch);
 var qs=DB.cards.filter(function(x){return x.lec===id&&x.k==='L'}).sort(function(a,b){return a.id-b.id});
 var h='<h2>'+esc(lname(l))+'</h2><p class="sub">'+qs.length+(qs.length===1?' question':' questions')+' · tap a box to edit it</p>';
 h+='<div class="lbl">Questions</div>';
 if(!qs.length)h+='<p class="sub" style="margin-top:8px">No questions yet.</p>';
 qs.forEach(function(q,i){h+='<div class="qrow"><b>Q'+(i+1)+'</b><input class="in" value="'+esc(q.text)+'" placeholder="Question text (optional)" onchange="setTx('+q.id+',this.value)"><button class="x2" aria-label="Delete question '+(i+1)+'" onclick="delCard('+q.id+')">&times;</button></div>'});
 h+='<button class="btn alt" onclick="addQ('+id+')">Add question</button>';
 if(DB.cards.some(function(x){return x.lec===id&&x.k==='S'}))h+='<button class="btn alt" onclick="delPS('+id+')">Remove practice sheet</button>';
 else h+='<button class="btn alt" onclick="addPS('+id+')">Add practice sheet</button>';
 h+='<div class="lbl">Lecture number</div><div class="qrow"><input class="in" id="l-num" type="number" min="1" inputmode="numeric" value="'+l.num+'"><button class="btn alt" style="width:auto;padding:16px 20px;margin-top:0" onclick="setLecNum('+id+')">Save</button></div>';
 h+='<button class="btn bad" onclick="delLec('+id+')">Delete lecture</button>';
 sh(h)}
function addQ(id){var l=lec(id);if(!l)return;var c=ch(l.ch);
 mk('L',c.id,id,'','',Date.now());relabel();save();lecSheet(id);render();toast('Question added')}
function delCard(id){var q=DB.cards.filter(function(x){return x.id===id})[0];if(!q)return;var lid=q.lec;keep();
 DB.cards=DB.cards.filter(function(x){return x.id!==id});relabel();sessClean();save();
 if(lid&&lec(lid))lecSheet(lid);else closeSh();render();toast('Question deleted',true)}
function addPS(id){var l=lec(id);if(!l)return;var c=ch(l.ch);mk('S',c.id,id,'','',Date.now());relabel();save();lecSheet(id);render();toast('Practice sheet added')}
function delPS(id){keep();DB.cards=DB.cards.filter(function(x){return !(x.lec===id&&x.k==='S')});sessClean();save();lecSheet(id);render();toast('Practice sheet removed',true)}
function setTx(id,v){DB.cards.forEach(function(c){if(c.id===id)c.text=String(v).trim()});save()}
function setLecNum(id){var l=lec(id);if(!l)return;var n=parseInt($('l-num').value,10);
 if(!(n>=1)){toast('Enter a lecture number');return}
 if(DB.lecs.some(function(x){return x.ch===l.ch&&x.id!==id&&x.num===n})){toast('Lecture '+n+' already exists');return}
 l.num=n;relabel();save();lecSheet(id);render();toast('Lecture saved')}
function delLec(id){var l=lec(id);if(!l)return;var cn=l.num,cid=l.ch;keep();
 DB.lecs=DB.lecs.filter(function(x){return x.id!==id});DB.cards=DB.cards.filter(function(x){return x.lec!==id});
 sessClean();save();if(ch(cid))chSheet(cid);else closeSh();render();toast('Lecture '+cn+' deleted',true)}
function compSheet(id){sh('<h2>Complete chapter</h2><p class="sub">The chapter test opens 3 days from now. It covers every lecture question in this chapter plus your PYQ sets.</p><div class="lbl">PYQs in this chapter</div><input class="in" id="c-n" type="number" min="0" inputmode="numeric" placeholder="240"><div class="lbl">Questions per set</div><input class="in" id="c-b" type="number" min="5" value="20" inputmode="numeric"><button class="btn" onclick="doComp('+id+')">Complete chapter</button>')}
function doComp(id){var c=ch(id);if(!c)return;
 var n=parseInt($('c-n').value,10)||0,b=Math.max(5,parseInt($('c-b').value,10)||20),k,s=Math.ceil(n/b),t=Date.now();
 c.done=true;c.doneAt=t;c.testDue=dayStart(t+3*DAY);
 for(k=1;k<=s;k++){var card=mk('P',id,0,'',c.testDue);card.set=k}
 relabel();save();closeSh();render();toast('Test scheduled in 3 days')}
function expSheet(){sh('<h2>Export</h2><p class="sub">Copy this text and keep it somewhere safe.</p><textarea class="in" id="ex" readonly style="min-height:180px">'+esc(JSON.stringify(DB))+'</textarea><button class="btn" onclick="cp()">Copy</button>')}
function cp(){var e=$('ex');e.select();try{navigator.clipboard.writeText(e.value).then(function(){toast('Copied')},function(){document.execCommand('copy');toast('Copied')})}catch(x){document.execCommand('copy');toast('Copied')}}
function impSheet(){sh('<h2>Import</h2><p class="sub">Paste exported text. This replaces your current data.</p><textarea class="in" id="im" style="min-height:180px"></textarea><button class="btn" onclick="doImp()">Import</button>')}
function doImp(){try{var d=JSON.parse($('im').value);
 if(!d||typeof d!=='object'||(!d.chs&&!d.cards))throw 0;
 DB=normalize(d);fix();save();LAST=null;closeSh();render();toast('Imported')}
 catch(e){toast('That text is not a valid export')}}
function reset(){keep();DB=DEF();save();closeSh();render();toast("Everything erased",true)}
function sampleSheet(){sh('<h2>Load sample data?</h2><p class="sub">This replaces what you have now. You can undo straight after.</p><button class="btn" onclick="sample()">Load sample</button><button class="btn alt" onclick="closeSh()">Cancel</button>')}
function eraseSheet(){sh('<h2>Erase everything?</h2><p class="sub">Every chapter, lecture, question and stat on this device will be deleted. You can undo straight after.</p><button class="btn bad" onclick="reset()">Erase everything</button><button class="btn alt" onclick="closeSh()">Cancel</button>')}
function sample(){var t=Date.now(),i,j,k,n;keep();
 DB=DEF();
 var c2={id:DB.nid++,num:2,name:'Loops',done:true,doneAt:t-5*DAY,testDue:dayStart(t-2*DAY),testDone:false},c3={id:DB.nid++,num:3,name:'Arrays',done:false,doneAt:0,testDue:0,testDone:false};DB.chs.push(c2,c3);
 for(i=1;i<=3;i++){var l={id:DB.nid++,ch:c2.id,num:i};DB.lecs.push(l);for(j=1;j<=6;j++){var mc=mk('L',c2.id,l.id,'','',t);n=Math.random()*5+2;mc.state='review';mc.reps=2+(j%3);mc.lapses=j%5===0?1:0;mc.S=n;mc.D=4+j%4;mc.last=t-n*DAY*(.6+Math.random()*.8);mc.due=mc.last+n*DAY}}
 for(k=1;k<=4;k++){var pc=mk('P',c2.id,0,'',c2.testDue);pc.set=k}
 for(i=1;i<=2;i++){var l2={id:DB.nid++,ch:c3.id,num:i};DB.lecs.push(l2);for(j=1;j<=(i===1?4:7);j++)mk('L',c3.id,l2.id,'','',t);if(i===1)mk('S',c3.id,l2.id,'','',t)}
 for(i=0;i<DB.cards.length;i++)if(DB.cards[i].k==='L'&&Math.random()<.4)DB.cards[i].text='Explain with an example.';
 for(i=1;i<=12;i++){var ds=dayStart(t)-i*DAY,rn=3+(i*7)%9,sn=1+i%3;for(j=0;j<rn;j++)DB.log.push({t:ds+9*36e5+j*6e5,g:Math.random()<.14?1:Math.random()<.5?3:4,c:1});for(j=0;j<sn;j++)DB.focus.push({t:ds+17*36e5+j*36e5,m:25,ch:j%2?c3.id:c2.id})}
 relabel();save();tab='today';closeSh();render();toast('Sample data loaded',true)}
/* review */
function startAll(){var q=dueQ();begin(q.map(function(c){return c.id}),'Today',0)}
function startGroup(i){if(!G[i])return;begin(G[i].ids.slice(),'Today',0)}
function testSheet(id){var c=ch(id);if(!c)return;
 var cs=DB.cards.filter(function(x){return x.ch===id}),L=cs.filter(function(x){return x.k==='L'}).length,S=cs.filter(function(x){return x.k==='S'}).length,P=cs.filter(function(x){return x.k==='P'}).length,t=Date.now(),ready=c.testDue<=t;
 var h='<h2>Ch'+c.num+' test</h2><p class="sub">'+cs.length+' cards: '+L+' questions'+(S?' + '+S+' practice sheets':'')+(P?' + '+P+' PYQ sets':'')+'.</p>';
 h+=ready?'<p class="sub">Reviewing the whole chapter in one pass.</p>':'<p class="sub">Scheduled for '+new Date(c.testDue).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'. Starting now reviews it early, which is fine — it just comes back sooner.</p>';
 h+='<button class="btn" onclick="beginTest('+id+')">'+(ready?'Start test':'Start early')+'</button>';
 sh(h)}
function beginTest(id){var c=ch(id);if(!c)return;var ids=DB.cards.filter(function(x){return x.ch===id}).sort(function(a,b){var O={L:0,S:1,P:2};return(O[a.k]-O[b.k])||a.id-b.id}).map(function(x){return x.id});closeSh();begin(ids,'Test',id)}
function startTest(id){testSheet(id)}
function begin(ids,t,tc){ids=ids.filter(function(i){return !!DB.cards.filter(function(c){return c.id===i}).length});if(!ids.length){toast('Nothing to review');return}sess={ids:ids,i:0,test:tc,h:[]};$('ov').classList.add('on');show()}
function cardOf(id){return DB.cards.filter(function(c){return c.id===id})[0]}
function curCard(){return sess?cardOf(sess.ids[sess.i]):null}
function show(){if(!sess)return;
 while(sess.i<sess.ids.length&&!cardOf(sess.ids[sess.i]))sess.i++;
 if(sess.i>=sess.ids.length){finish();return}
 var c=curCard();if(!c)return;
 $('lab').textContent=c.label;$('ctx').textContent=c.leech?'Failed often. Consider rewriting it.':(c.k==='P'?'PYQ set · '+DB.cards.filter(function(x){return x.ch===c.ch&&x.k==='P'&&x.set===c.set}).length+' in chapter':c.k==='S'?'Practice sheet':'Lecture question');
 $('txt').textContent=c.text;$('txt').style.display=c.text?'block':'none';
 $('pb').style.width=(sess.i/sess.ids.length*100)+'%';$('undo').style.visibility=sess.h.length?'visible':'hidden';$('rev').style.display='block';$('gr').classList.remove('on');$('qc').style.display='flex';$('dn').classList.remove('on')}
function finish(){if(sess&&sess.test&&ch(sess.test)){ch(sess.test).testDone=true;save()}
 var total=sess?sess.ids.length:0;
 if($('undo'))$('undo').style.visibility=sess&&sess.h.length?'visible':'hidden';
 $('pb').style.width='100%';$('qc').style.display='none';$('gr').classList.remove('on');$('rev').style.display='none';
 $('dsub').textContent=total+(total===1?' question reviewed.':' questions reviewed.');$('dn').classList.add('on')}
function reveal(){var c=curCard();if(!c)return;var t=Date.now(),cs=['var(--coral)','var(--sun)','var(--mint)','var(--blue)'],nm=['Again','Hard','Good','Easy'];
 $('gr').innerHTML=nm.map(function(n,i){var p=plan(c,i+1,t);return '<button class="g" style="background:'+cs[i]+'" onclick="grade('+(i+1)+')">'+n+'<small>'+fmt((p.due-t)/DAY)+'</small></button>'}).join('');
 $('rev').style.display='none';$('gr').classList.add('on');var b=$('gr').querySelector('button');if(b&&b.focus)b.focus()}
function undo(){if(!sess)return;var h=sess.h.pop();if(!h)return;
 var c=cardOf(h.id);if(c)Object.assign(c,JSON.parse(h.s));
 DB.log.length=h.l;sess.i=Math.max(0,sess.i-1);
 if(sess.test&&ch(sess.test))ch(sess.test).testDone=false;
 save();show()}
function grade(g){if(!sess)return;var c0=curCard();
 if(!c0){sess.i++;show();return}
 sess.h.push({id:c0.id,s:JSON.stringify(c0),l:DB.log.length});apply(c0,g);sess.i++;
 if(sess.i>=sess.ids.length)finish();else show()}
function closeReview(){$('ov').classList.remove('on');sess=null;render();setTimeout(tryReload,300)}
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if($('sh')&&$('sh').classList.contains('on')){closeSh();return}
 if($('ov')&&$('ov').classList.contains('on'))closeReview()});
/* boot: a read failure must never leave a dead white screen */
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
function boot(){try{load();fix();render()}catch(e){
 DB=DEF();
 try{$('v-today').innerHTML='<div class="head"><h1>Recall</h1></div><div class="empty"><b>Your saved data could not be read</b><p>That can happen after an interrupted save or a bad import. Reset to start clean, or try reloading first.</p><button class="btn" onclick="location.reload()">Reload</button><button class="btn bad" onclick="wipe()">Reset data</button></div>';$('v-today').classList.add('on');$('nav').innerHTML=''}catch(x){} }}
boot();setInterval(function(){if(DB.pt.run&&pLeft()<=0)pEnd(true);else pDraw()},1000);setInterval(tick,30000);document.addEventListener('visibilitychange',tick);tick();sw();schedDaily();setInterval(tryReload,5000);
</script>
</body>
</html>
